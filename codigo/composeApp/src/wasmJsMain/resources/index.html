<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Book Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Tu biblioteca de EPUB: lectura normal y RSVP, subrayados, notas y sincronización con Drive.">
<meta name="theme-color" content="#09362F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Book Room">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* --alto: alto real de la pantalla (ver el script de abajo). Con la app instalada, iOS da a la
     página un 100% más bajo que la pantalla y recortaba todo lo que quedaba por debajo. */
  html, body { margin: 0; height: var(--alto, 100%); min-height: 100%; background: #09362F; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  /* La app llega hasta abajo del todo (detrás de la barra de inicio del iPhone); solo deja libre
     el notch. El hueco de la barra de inicio lo respetan el dock y los controles desde Compose. */
  #app { position: fixed; top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
         height: calc(var(--alto, 100lvh) - env(safe-area-inset-top, 0px)); }
  #sonda { position: fixed; left: 0; bottom: 0; width: 0; height: env(safe-area-inset-bottom, 0px); visibility: hidden; pointer-events: none; }
  #carga { position: fixed; inset: 0; display: grid; place-items: center; background: #09362F; color: #F4EEE3; z-index: 10; transition: opacity .45s; font-family: -apple-system, system-ui, sans-serif; }
  #carga.fuera { opacity: 0; pointer-events: none; }
  .caja { display: grid; justify-items: center; gap: 18px; padding: 24px; text-align: center; max-width: 320px; }
  .caja img { width: 116px; height: 116px; border-radius: 30px; }
  .caja h1 { margin: 0; font: 600 34px/1.1 Georgia, "Times New Roman", serif; letter-spacing: .01em; }
  .caja p { margin: 0; color: #C3D3CC; font-size: 15px; line-height: 1.45; }
  .barra { width: 160px; height: 3px; border-radius: 2px; background: #1D5149; overflow: hidden; }
  .barra i { display: block; width: 40%; height: 100%; background: #D9A441; border-radius: 2px; animation: va 1.1s ease-in-out infinite; }
  @keyframes va { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  #viejo { display: none; }
  #viejo b { color: #F4EEE3; }
  @media (prefers-reduced-motion: reduce) { .barra i { animation: none; width: 100%; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="sonda"></div>
<script>
// iOS, con la app instalada, a veces da una ventana más baja que la pantalla real y deja una franja
// vacía abajo. Se usa el alto real de la pantalla cuando la app está instalada.
(function () {
  const ajustar = () => {
    const inst = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    const vertical = matchMedia('(orientation: portrait)').matches;
    const real = vertical ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    const alto = inst && /iPhone|iPad|iPod/.test(navigator.userAgent) ? Math.max(real, innerHeight) : innerHeight;
    document.documentElement.style.setProperty('--alto', alto + 'px');
  };
  ajustar();
  addEventListener('resize', ajustar);
  addEventListener('orientationchange', () => setTimeout(ajustar, 300));
})();
</script>
<div id="carga">
  <div class="caja" id="cargando">
    <img src="icono-180.png" alt="">
    <h1>Book Room</h1>
    <div class="barra"><i></i></div>
    <p id="msg">Abriendo tu biblioteca…</p>
  </div>
  <div class="caja" id="viejo">
    <img src="icono-180.png" alt="">
    <h1>Book Room</h1>
    <p>Tu navegador es demasiado antiguo para abrir Book Room.</p>
    <p>En el iPhone necesitas <b>iOS 18.2 o posterior</b>. Actualízalo en <b>Ajustes → General → Actualización de software</b> y vuelve a entrar.</p>
  </div>
</div>
<script src="config.js"></script>
<script src="fflate.js"></script>
<script src="bridge.js"></script>
<script src="instalar.js"></script>
<script>
// ¿Admite este navegador WebAssembly con recolector de basura (Safari 18.2 / iOS 18.2 o posterior)?
const gc = typeof WebAssembly === 'object' && WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
if (!gc) {
  document.getElementById('cargando').style.display = 'none';
  document.getElementById('viejo').style.display = 'grid';
} else {
  // Cuando la app pinta su primer fotograma, se quita la pantalla de carga
  new MutationObserver((m, o) => {
    if (document.querySelector('#app canvas')) {
      o.disconnect();
      setTimeout(() => {
        document.getElementById('carga').classList.add('fuera');
      }, 350);
    }
  }).observe(document.getElementById('app'), { childList: true, subtree: true });
  if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  const s = document.createElement('script'); s.src = 'bookroom.js'; s.type = 'application/javascript';
  s.onerror = () => { document.getElementById('msg').textContent = 'No se ha podido cargar. Comprueba tu conexión y vuelve a entrar.'; };
  document.body.appendChild(s);
}
</script>
</body>
</html>
